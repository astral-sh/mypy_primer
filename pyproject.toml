[project]
name = "mypy_primer"
version = "0.1.0"
authors = [{ name = "Shantanu Jain" }, { email = "hauntsaninja@gmail.com" }]
description = "Run mypy over millions of lines of code"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.urls]
homepage = "https://github.com/hauntsaninja/mypy_primer"
repository = "https://github.com/hauntsaninja/mypy_primer"

[project.scripts]
mypy_primer = "mypy_primer.main:main"

[dependency-groups]
dev = [
    "black>=25.1.0",
    "flake8>=7.1.2",
    "isort>=6.0.1",
    "mypy>=1.15.0",
]

[tool.black]
line-length = 100
skip-magic-trailing-comma = true

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.uv]
require-build-hashes = true
preview-features = ["build-dependency-hashes"]
build-constraint-dependencies = [
    { requirement = "setuptools==84.0.0", hashes = [
        "sha256:51a52592b3b99e102b609654876bd65f19f999935166d1352678931132b0c670",
        "sha256:f4695c21257f0d9b537ec2692c941d02ee143b7cc1276941349a546573b2ef73",
    ] },
]
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
